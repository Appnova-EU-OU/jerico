<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerico</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src data:; frame-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <link rel="stylesheet" href="./first-run/_fonts.css" />
    <style>
      :root {
        --bg: #0b0b0b;
        --ink: #f2f0ec;
        --ink-2: #a5a19a;
        --rule-2: #34342f;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(.2, .7, .2, 1);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      body { opacity: 1; transition: opacity 220ms var(--ease); }
      body.leaving { opacity: 0; }
      #host {
        position: fixed;
        inset: 0;
        background: transparent;
      }
      #host iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: transparent;
      }
      #skip-tour {
        position: fixed;
        /* Main supplies the active display's work-area insets. The intro still
           covers the complete display, but this action must sit above a
           bottom/right Dock instead of disappearing underneath it. */
        right: var(--skip-safe-right, 22px);
        bottom: var(--skip-safe-bottom, 20px);
        z-index: 20;
        border: 1px solid rgba(242, 240, 236, .48);
        border-radius: 2px;
        padding: 8px 11px;
        background: rgba(11, 11, 11, .88);
        color: var(--ink-2);
        font: 500 10.5px/1 var(--mono);
        letter-spacing: .09em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 160ms var(--ease), border-color 160ms var(--ease),
          background 160ms var(--ease), transform 100ms var(--ease), opacity 180ms var(--ease);
      }
      #skip-tour:hover,
      #skip-tour:focus-visible {
        color: var(--ink);
        border-color: var(--ink);
        background: rgba(11, 11, 11, .96);
        outline: none;
      }
      #skip-tour:active { transform: translateY(1px); }
      #skip-tour[hidden] { display: none; }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        body, #skip-tour { transition-duration: .001ms; }
      }
    </style>
  </head>
  <body>
    <p class="sr">Jerico is starting. The opening film completes before the rest of the tour can be skipped.</p>
    <div class="sr" id="announcement" role="status" aria-live="polite"></div>
    <div id="host"></div>
    <button type="button" id="skip-tour" hidden>Skip tour</button>
    <script type="module" src="./src/first-run.ts"></script>
  </body>
</html>
