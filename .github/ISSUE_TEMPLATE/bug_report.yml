name: Bug report
description: Something in the daemon, MCP server, codegraph or desktop app does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Please do not file it here — see SECURITY.md.
        Remove tokens, hostnames and personal paths from anything you paste.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - daemon (bridge-agent)
        - mcp-server
        - codegraph
        - desktop app
        - shared / protocol
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`bridge-agent --version`, or the desktop app's About box"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node.js version
      placeholder: macOS 15.5 arm64, Node 22.14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
